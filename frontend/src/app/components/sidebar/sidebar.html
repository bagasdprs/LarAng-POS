<aside
  [ngClass]="isSidebarOpen ? 'w-64' : 'w-[88px]'"
  class="flex flex-col h-screen py-8 bg-gradient-to-b from-[#1B211A] via-[#283E2F] to-[#1F3A3D] border-r border-[#ffffff10] shadow-2xl transition-all duration-300 ease-in-out relative z-50 overflow-hidden"
>
  <button
    (click)="toggleSidebar()"
    class="absolute top-10 right-0 w-6 h-12 bg-[#628141]/80 backdrop-blur-sm rounded-l-lg flex items-center justify-center text-white hover:bg-[#8BAE66] border-y border-l border-white/10 shadow-lg transition-all z-50 cursor-pointer group"
  >
    <svg
      [ngClass]="isSidebarOpen ? '' : 'rotate-180'"
      class="w-3 h-3 text-white/80 group-hover:text-white group-hover:scale-125 transition-all duration-300"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7" />
    </svg>
  </button>

  <div class="shrink-0">
    <a
      routerLink="/dashboard"
      class="flex items-center"
      [ngClass]="isSidebarOpen ? 'px-6' : 'justify-center px-0'"
    >
      <div
        class="w-10 h-10 shrink-0 bg-gradient-to-br from-[#628141] to-[#8BAE66] rounded-xl flex items-center justify-center shadow-lg relative overflow-hidden group"
      >
        <span class="text-white font-bold text-xl relative z-10">L</span>
        <div
          class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-500"
        ></div>
      </div>
      @if (isSidebarOpen) {
        <span
          class="ml-3 text-xl font-bold text-white tracking-wide whitespace-nowrap overflow-hidden"
          >Larang POS</span
        >
      }
    </a>
  </div>

  <div
    class="flex flex-col justify-between flex-1 mt-10 px-4 overflow-y-auto overflow-x-hidden custom-scrollbar"
  >
    <nav class="space-y-2">
      <a
        routerLink="/dashboard"
        routerLinkActive="bg-gradient-to-r from-[#628141] to-[#526f35] text-white shadow-lg shadow-[#628141]/20 border-none"
        [routerLinkActiveOptions]="{ exact: true }"
        [ngClass]="isSidebarOpen ? 'px-4' : 'justify-center px-0'"
        class="flex items-center py-3 text-[#A0BBA5] transition-all transform rounded-xl hover:bg-[#ffffff15] hover:text-white cursor-pointer group border border-transparent"
        title="Dashboard"
      >
        <svg
          class="w-5 h-5 shrink-0 group-hover:scale-110 transition-transform"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M19 11H5M19 11C20.1046 11 21 11.8954 21 13V19C21 20.1046 20.1046 21 19 21H5C3.89543 21 3 20.1046 3 19V13C3 11.8954 3.89543 11 5 11M19 11V9C19 7.89543 18.1046 7 17 7M5 11V9C5 7.89543 5.89543 7 7 7M7 7V5C7 3.89543 7.89543 3 9 3H15C16.1046 3 17 3.89543 17 5V7M7 7H17"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        @if (isSidebarOpen) {
          <span class="mx-4 font-medium whitespace-nowrap truncate">Dashboard</span>
        }
      </a>

      <a
        routerLink="/products"
        routerLinkActive="bg-gradient-to-r from-[#628141] to-[#526f35] text-white shadow-lg shadow-[#628141]/20 border-none"
        [ngClass]="isSidebarOpen ? 'px-4' : 'justify-center px-0'"
        class="flex items-center py-3 text-[#A0BBA5] transition-all transform rounded-xl hover:bg-[#ffffff15] hover:text-white cursor-pointer group border border-transparent"
        title="Products"
      >
        <svg
          class="w-5 h-5 shrink-0 group-hover:scale-110 transition-transform"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"
          />
        </svg>
        @if (isSidebarOpen) {
          <span class="mx-4 font-medium whitespace-nowrap truncate">Products</span>
        }
      </a>

      <a
        routerLink="/categories"
        routerLinkActive="bg-gradient-to-r from-[#628141] to-[#526f35] text-white shadow-lg shadow-[#628141]/20 border-none"
        [ngClass]="isSidebarOpen ? 'px-4' : 'justify-center px-0'"
        class="flex items-center py-3 text-[#A0BBA5] transition-all transform rounded-xl hover:bg-[#ffffff15] hover:text-white cursor-pointer group border border-transparent"
        title="Categories"
      >
        <svg
          class="w-5 h-5 shrink-0 group-hover:scale-110 transition-transform"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"
          />
        </svg>
        @if (isSidebarOpen) {
          <span class="mx-4 font-medium whitespace-nowrap truncate">Categories</span>
        }
      </a>

      <a
        routerLink="/users"
        routerLinkActive="bg-gradient-to-r from-[#628141] to-[#526f35] text-white shadow-lg shadow-[#628141]/20 border-none"
        [ngClass]="isSidebarOpen ? 'px-4' : 'justify-center px-0'"
        class="flex items-center py-3 text-[#A0BBA5] transition-all transform rounded-xl hover:bg-[#ffffff15] hover:text-white cursor-pointer group border border-transparent"
        title="Users Management"
      >
        <svg
          class="w-5 h-5 shrink-0 group-hover:scale-110 transition-transform"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
          />
        </svg>
        @if (isSidebarOpen) {
          <span class="mx-4 font-medium whitespace-nowrap truncate">Users Mgmt</span>
        }
      </a>
    </nav>

    <div class="mt-6 mb-2 shrink-0">
      <div
        [ngClass]="isSidebarOpen ? 'p-3 px-4' : 'p-2 justify-center'"
        class="flex items-center gap-x-3 bg-[#ffffff08] border border-[#ffffff10] rounded-2xl transition-all duration-300 hover:bg-[#ffffff15] cursor-pointer"
      >
        <img
          class="object-cover rounded-full h-9 w-9 border-2 border-[#628141] shrink-0"
          src="https://ui-avatars.com/api/?name=Bagas&background=EBD5AB&color=1B211A"
          alt="avatar"
        />

        @if (isSidebarOpen) {
          <div class="overflow-hidden flex-1">
            <h4 class="text-sm font-bold text-white truncate">Bagas</h4>
            <p class="text-[10px] text-[#A0BBA5] uppercase tracking-widest truncate">Super Admin</p>
          </div>
          <button
            class="text-[#A0BBA5] hover:text-red-400 p-1.5 rounded-lg transition-colors hover:bg-red-500/10 shrink-0"
          >
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
              />
            </svg>
          </button>
        }
      </div>
    </div>
  </div>
</aside>
