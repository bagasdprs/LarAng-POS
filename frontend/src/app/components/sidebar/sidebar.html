<aside
  class="flex flex-col w-64 h-screen px-4 py-8 overflow-y-auto border-r rtl:border-r-0 rtl:border-l bg-[#1B211A] border-gray-700"
>
  <a href="#" class="flex items-center mx-auto">
    <div
      class="w-10 h-10 bg-linear-to-br from-[#628141] to-[#8BAE66] rounded-lg flex items-center justify-center shadow-lg"
    >
      <span class="text-white font-bold text-xl">L</span>
    </div>
    <span class="ml-3 text-2xl font-bold text-white tracking-wide">Larang POS</span>
  </a>

  <div class="flex flex-col justify-between flex-1 mt-10">
    <nav class="space-y-2">
      <a
        routerLink="/dashboard"
        routerLinkActive="bg-[#628141] text-white shadow-md"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center px-4 py-3 text-gray-400 transition-colors transform rounded-lg hover:bg-gray-800 hover:text-gray-200 cursor-pointer"
      >
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M19 11H5M19 11C20.1046 11 21 11.8954 21 13V19C21 20.1046 20.1046 21 19 21H5C3.89543 21 3 20.1046 3 19V13C3 11.8954 3.89543 11 5 11M19 11V9C19 7.89543 18.1046 7 17 7M5 11V9C5 7.89543 5.89543 7 7 7M7 7V5C7 3.89543 7.89543 3 9 3H15C16.1046 3 17 3.89543 17 5V7M7 7H17"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span class="mx-4 font-medium">Dashboard</span>
      </a>

      <a
        routerLink="/products"
        routerLinkActive="bg-[#628141] text-white shadow-md"
        class="flex items-center px-4 py-3 text-gray-400 transition-colors duration-300 transform rounded-lg hover:bg-gray-800 hover:text-gray-200 cursor-pointer"
      >
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"
          />
        </svg>
        <span class="mx-4 font-medium">Products</span>
      </a>

      <a
        routerLink="/categories"
        routerLinkActive="bg-[#628141] text-white shadow-md"
        class="flex items-center px-4 py-3 mt-5 text-gray-400 transition-colors duration-300 transform rounded-lg hover:bg-gray-800 hover:text-gray-200 cursor-pointer"
      >
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"
          />
        </svg>
        <span class="mx-4 font-medium">Categories</span>
      </a>

      <a
        href="#"
        class="flex items-center px-4 py-3 mt-5 text-gray-400 transition-colors duration-300 transform rounded-lg hover:bg-gray-800 hover:text-gray-200"
      >
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
          />
        </svg>
        <span class="mx-4 font-medium">Users</span>
      </a>
    </nav>

    <div class="mt-6">
      <div class="flex items-center gap-x-2 p-3 bg-gray-800 rounded-xl">
        <img
          class="object-cover rounded-full h-9 w-9 border-2 border-[#628141]"
          src="https://ui-avatars.com/api/?name=Bagas&background=EBD5AB&color=1B211A"
          alt="avatar"
        />
        <div>
          <h4 class="text-sm font-medium text-white">Bagas</h4>
          <p class="text-xs text-gray-400">Super Admin</p>
        </div>
        <button class="ml-auto text-gray-400 hover:text-red-400">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
            />
          </svg>
        </button>
      </div>
    </div>
  </div>
</aside>
