<div
  class="fixed inset-0 z-100 bg-[#1B211A]/60 backdrop-blur-sm flex items-center justify-center p-4"
>
  <div
    class="bg-white w-full max-w-2xl rounded-4xl shadow-2xl border border-gray-100 p-8 md:p-10 relative no-scrollbar max-h-[95vh] overflow-y-auto"
  >
    <div class="flex justify-between items-start mb-8">
      <div>
        <h1 class="text-2xl font-bold text-[#1B211A]">
          {{ isEditMode ? 'Edit Team Member' : 'Add New Team Member' }}
        </h1>
        <p class="text-sm text-gray-500 mt-1">Enter details to invite a new user to the system.</p>
      </div>
      <button
        (click)="closeModal()"
        class="p-2 text-gray-400 hover:text-gray-800 hover:bg-gray-100 rounded-full transition cursor-pointer"
      >
        <ng-icon name="heroXMark" class="text-xl"></ng-icon>
      </button>
    </div>

    <div class="mb-10">
      <div class="flex items-center gap-3 mb-6">
        <div
          class="w-8 h-8 rounded-lg bg-[#EBD5AB]/30 text-[#628141] flex items-center justify-center"
        >
          <ng-icon name="heroIdentification" class="text-lg"></ng-icon>
        </div>
        <h3 class="font-bold text-[#1B211A] text-lg">Account Details</h3>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
          <input
            type="text"
            [(ngModel)]="user.fullName"
            class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-[#628141] outline-none transition"
            placeholder="e.g. Jane Doe"
          />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
          <input
            type="email"
            [(ngModel)]="user.email"
            class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-[#628141] outline-none transition"
            placeholder="jane@larang.com"
          />
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Temporary Password</label>
        <div class="relative">
          <input
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="user.password"
            class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-[#628141] outline-none transition tracking-widest"
            placeholder="••••••••"
          />
          <button
            (click)="togglePassword()"
            class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition"
          >
            <ng-icon [name]="showPassword ? 'heroEyeSlash' : 'heroEye'" class="text-lg"></ng-icon>
          </button>
        </div>
        <p class="text-[10px] text-gray-400 mt-1.5">
          User will be prompted to change this on first login.
        </p>
      </div>
    </div>

    <div class="mb-10">
      <div class="flex items-center gap-3 mb-6">
        <div class="w-8 h-8 rounded-lg bg-green-50 text-[#628141] flex items-center justify-center">
          <ng-icon name="heroShieldCheck" class="text-lg"></ng-icon>
        </div>
        <h3 class="font-bold text-[#1B211A] text-lg">Role & Permissions</h3>
      </div>

      <div class="flex bg-[#F9F5F0] p-1.5 rounded-2xl mb-6">
        <button
          (click)="setRole('Admin')"
          [ngClass]="
            user.role === 'Admin'
              ? 'bg-[#628141] text-white shadow-md'
              : 'text-gray-500 hover:text-[#1B211A]'
          "
          class="flex-1 py-2 rounded-xl text-sm font-bold transition"
        >
          Admin
        </button>
        <button
          (click)="setRole('Manager')"
          [ngClass]="
            user.role === 'Manager'
              ? 'bg-[#628141] text-white shadow-md'
              : 'text-gray-500 hover:text-[#1B211A]'
          "
          class="flex-1 py-2 rounded-xl text-sm font-bold transition"
        >
          Manager
        </button>
        <button
          (click)="setRole('Cashier')"
          [ngClass]="
            user.role === 'Cashier'
              ? 'bg-[#628141] text-white shadow-md'
              : 'text-gray-500 hover:text-[#1B211A]'
          "
          class="flex-1 py-2 rounded-xl text-sm font-bold transition"
        >
          Cashier
        </button>
      </div>

      <div class="bg-gray-50 p-6 rounded-2xl border border-gray-100">
        <h4 class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-4">
          {{ user.role }} PERMISSIONS
        </h4>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-y-4 gap-x-6">
          @for (perm of currentPermissions; track perm.name) {
            <label class="flex items-start gap-3 cursor-pointer group">
              <div
                class="relative flex items-center justify-center w-5 h-5 mt-0.5 rounded border transition"
                [ngClass]="
                  perm.checked
                    ? 'bg-[#628141] border-[#628141]'
                    : 'border-gray-300 bg-white group-hover:border-[#628141]'
                "
              >
                @if (perm.checked) {
                  <svg
                    class="w-3 h-3 text-white"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="3"
                      d="M5 13l4 4L19 7"
                    />
                  </svg>
                }
                <input type="checkbox" [(ngModel)]="perm.checked" class="sr-only" />
              </div>
              <div>
                <p class="text-sm font-bold text-[#1B211A] leading-tight">{{ perm.name }}</p>
                <p class="text-[10px] text-gray-500">{{ perm.desc }}</p>
              </div>
            </label>
          }
        </div>
      </div>
    </div>

    <div class="flex justify-end gap-3 pt-6 border-t border-gray-100">
      <button
        (click)="closeModal()"
        class="px-6 py-2.5 bg-white border border-gray-200 text-gray-700 rounded-xl text-sm font-bold hover:bg-gray-50 transition cursor-pointer"
      >
        Cancel
      </button>
      <button
        (click)="saveUser()"
        class="flex items-center gap-2 bg-[#628141] text-white px-6 py-2.5 rounded-xl text-sm font-bold hover:bg-[#526f35] shadow-lg transition"
      >
        <ng-icon name="heroPaperAirplane" class="text-lg"></ng-icon>
        {{ isEditMode ? 'Save Changes' : 'Invite User' }}
      </button>
    </div>
  </div>
</div>
