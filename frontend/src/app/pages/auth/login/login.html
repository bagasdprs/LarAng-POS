<div class="min-h-screen w-full flex bg-white font-sans">
  <div
    class="hidden lg:flex w-1/2 bg-[#EBD5AB] relative flex-col justify-between p-12 overflow-hidden border-r border-[#d9c398]"
  >
    <div class="flex items-center gap-3 relative z-10">
      <div
        class="w-10 h-10 bg-[#1B211A] text-white rounded-xl flex items-center justify-center font-bold text-xl shadow-lg"
      >
        L
      </div>
      <span class="text-2xl font-extrabold text-[#1B211A] tracking-tight">LarAng POS</span>
    </div>

    <div class="relative z-10 flex-1 flex items-center justify-center mt-8">
      <lottie-player
        src="https://lottie.host/d462106d-01d7-42e1-b700-1ce85e3da3c8/LM6Neh7be4.json"
        background="transparent"
        speed="1"
        class="w-[55%] max-w-sm drop-shadow-2xl"
        loop
        autoplay
      >
      </lottie-player>
    </div>

    <div class="relative z-10 mt-10">
      <h3 class="text-2xl font-bold text-[#1B211A] mb-4 leading-snug">
        Manage your retail business <br />
        with organic flow.
      </h3>
      <div class="flex items-center gap-4">
        <div class="w-12 h-1 bg-[#628141] rounded-full"></div>
        <p class="text-sm font-bold text-[#1B211A]/80">Sustainable Commerce Solutions</p>
      </div>
    </div>

    <div
      class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-[#F9F5F0]/60 rounded-full mix-blend-overlay filter blur-3xl opacity-80"
    ></div>
    <div
      class="absolute bottom-[-10%] right-[-10%] w-120 h-120 bg-[#628141]/30 rounded-full mix-blend-multiply filter blur-3xl opacity-70"
    ></div>
  </div>

  <div
    class="w-full lg:w-1/2 flex items-center justify-center p-8 sm:p-12 lg:p-24 bg-white relative"
  >
    <div class="absolute top-8 left-8 flex lg:hidden items-center gap-3">
      <div
        class="w-8 h-8 bg-[#1B211A] text-white rounded-lg flex items-center justify-center font-bold shadow-md"
      >
        L
      </div>
      <span class="text-xl font-extrabold text-[#1B211A]">Larang POS</span>
    </div>

    <div class="w-full max-w-md">
      <div class="mb-10">
        <h2 class="text-3xl font-extrabold text-[#1B211A] mb-2">Welcome back</h2>
        <p class="text-gray-500">Please enter your details to sign in.</p>
      </div>

      <form (ngSubmit)="onLogin()" class="flex flex-col gap-5">
        <div>
          <label class="block text-sm font-bold text-[#1B211A] mb-2">Email address</label>
          <div class="relative">
            <ng-icon
              name="heroEnvelope"
              class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg"
            ></ng-icon>
            <input
              type="email"
              name="email"
              [(ngModel)]="email"
              placeholder="name@company.com"
              class="w-full pl-11 pr-4 py-3.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-[#628141] focus:bg-white outline-none transition"
              required
            />
          </div>
        </div>

        <div>
          <label class="block text-sm font-bold text-[#1B211A] mb-2">Password</label>
          <div class="relative">
            <ng-icon
              name="heroLockClosed"
              class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg"
            ></ng-icon>
            <input
              [type]="showPassword ? 'text' : 'password'"
              name="password"
              [(ngModel)]="password"
              placeholder="••••••••"
              class="w-full pl-11 pr-12 py-3.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-[#628141] focus:bg-white outline-none transition"
              required
            />
            <button
              type="button"
              (click)="togglePassword()"
              class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition p-1"
            >
              <ng-icon [name]="showPassword ? 'heroEyeSlash' : 'heroEye'" class="text-lg"></ng-icon>
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between mt-2 mb-4">
          <label class="flex items-center gap-2 cursor-pointer group">
            <div class="relative flex items-center justify-center">
              <input type="checkbox" class="peer sr-only" />
              <div
                class="w-5 h-5 border-2 border-gray-300 rounded transition group-hover:border-[#628141] peer-checked:bg-[#628141] peer-checked:border-[#628141]"
              ></div>
              <ng-icon
                name="heroCheck"
                class="absolute text-white text-xs opacity-0 peer-checked:opacity-100 transition"
              ></ng-icon>
            </div>
            <span class="text-sm font-medium text-gray-600 group-hover:text-gray-800 transition"
              >Remember me</span
            >
          </label>

          <a href="#" class="text-sm font-bold text-[#628141] hover:text-[#4d6633] transition">
            Forgot password?
          </a>
        </div>

        <button
          type="submit"
          [disabled]="isLoading || !email || !password"
          class="w-full py-3.5 bg-[#1B211A] text-white rounded-xl font-bold hover:bg-black transition shadow-lg shadow-gray-900/20 flex justify-center items-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed"
        >
          @if (isLoading) {
            <svg
              class="animate-spin h-5 w-5 text-white"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
            >
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              ></circle>
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
              ></path>
            </svg>
            Signing in...
          } @else {
            Sign in
          }
        </button>
      </form>

      <div class="mt-10 text-center">
        <p class="text-sm text-gray-500 font-medium">
          Don't have an account?
          <a routerLink="/register" class="text-[#628141] font-bold hover:underline transition"
            >Register for free</a
          >
        </p>
      </div>
    </div>
  </div>
</div>
